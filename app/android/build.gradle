allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.value(
        rootProject.layout.projectDirectory.dir('../build'))
subprojects {
    project.layout.buildDirectory.value(
            rootProject.layout.buildDirectory.dir(project.name))
}

// Kept separate from the block above: evaluationDependsOn forces ':app' to be
// evaluated at once, which must not happen before every subproject has had its
// build directory redirected.
subprojects {
    project.evaluationDependsOn(':app')

    // Disable all tasks whose name contains "ArtProfile", see #341
    tasks.configureEach {
        if (name.contains("ArtProfile")) {
            enabled = false
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
