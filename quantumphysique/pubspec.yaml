name: quantumphysique
description: Shared Flutter library for QuantumPhysique apps — theme, preferences, notifier, widgets, settings pages, and changelog system.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dynamic_color: ^2.1.0
  flutter_auto_size_text: ^5.0.0
  flutter_local_notifications: ^21.0.0
  flutter_m3shapes_extended: ^2.0.0
  intl: ^0.20.2
  material_color_utilities: ^0.13.0
  material_ui: ^1.1.0
  package_info_plus: ^10.2.1
  phosphor_flutter: ^2.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  timezone: ^0.11.0
  url_launcher: ^6.3.2

# Development-only (consumers ignore dependency_overrides): phosphor_flutter
# 2.1.0 as published does not compile against the current Flutter, which
# otherwise breaks `flutter test` in this package. Consumers such as adonify
# already carry the same override.
dependency_overrides:
  phosphor_flutter:
    git:
      url: https://github.com/subarnaPdl/phosphor_icons.git
      ref: 514f0a883571c4453dbd6ee3041d1dcba4fb8fc7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: RobotoFlex
      fonts:
        - asset: fonts/RobotoFlex-VariableFont_wght.ttf
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-VariableFont_wght.ttf
        - asset: fonts/RobotoMono-Italic-VariableFont_wght.ttf
          style: italic
